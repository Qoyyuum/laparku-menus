name = "laparku-menus"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]
# Custom domain — Cloudflare provisions cert + DNS automatically since
# laparku.co.bn is a zone on this account.
routes = [
  { pattern = "menu.laparku.co.bn", custom_domain = true },
]
# Keep the *.workers.dev URL serving too — links already circulated point there.
workers_dev = true

[vars]
# Doubles as the better-auth baseURL — magic links are built against it.
PUBLIC_BASE_URL = "https://menu.laparku.co.bn"
# Cloudflare Turnstile site key — replace after creating the widget in the CF
# dashboard (Security → Turnstile). The matching secret is TURNSTILE_SECRET_KEY.
# Until set, Turnstile verification is not active.
TURNSTILE_SITE_KEY = "TODO-create-turnstile-widget"
# Extraction pipeline: Workers AI vision model + provider selector
# ("workers-ai" in production; tests override EXTRACTOR with "stub").
EXTRACTION_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
EXTRACTOR = "workers-ai"
# Freshness: a venue surfaces on the admin staleness list when unverified
# for STALE_MONTHS (or never verified) or when STALE_NO_VOTES distinct
# users vote "not accurate" since the last verification.
STALE_MONTHS = "6"
# Transactional-mail sender — the from-domain must be onboarded to Cloudflare
# Email Sending (see the [[send_email]] note below).
AUTH_EMAIL_FROM = "Laparku <no-reply@laparku.co.bn>"
STALE_NO_VOTES = "3"
# Google Maps link import: provider chain tried in order (browser →
# serpfast). "stub" isolates tests from the network.
GMAPS_PROVIDER = "browser,serpfast"
# Budgets: browser session-seconds/day (~20 min ≈ the 10 free
# browser-hours/month), serpfast calls/day, trusted-published items/day.
GMAPS_DAILY_BROWSER_SECONDS = "1200"
SERPFAST_DAILY_CALL_CAP = "60"
GMAPS_DAILY_ITEM_CAP = "100"

[[d1_databases]]
binding = "DB"
database_name = "laparku-menus-db"
database_id = "7bd7bcbc-9e86-4736-bafb-c743a9054647"

[[r2_buckets]]
binding = "SUBMISSIONS"
bucket_name = "laparku-menus-submissions"

[[queues.producers]]
binding = "SUBMISSION_QUEUE"
queue = "laparku-menus-submissions"

[[queues.consumers]]
queue = "laparku-menus-submissions"
max_retries = 3

# Workers Builds (git-connected CI): app/dist is gitignored, so a CI deploy
# must install deps and rebuild the Expo web export before uploading.
[build]
command = "bun install && bun run build:web"

# Expo web export output — the worker serves it for all non-/api paths with an
# SPA fallback to index.html (see src/index.ts).
[assets]
directory = "./app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker must see /api/* before the SPA fallback — without this, browser
# navigations (Sec-Fetch-Mode: navigate, e.g. magic-link clicks) get served
# index.html by the assets binding and never reach the API.
run_worker_first = ["/api/*", "/mcp"]

[ai]
binding = "AI"

# Cloudflare Browser Run — headless Chrome for the gmaps_link import
# provider (src/lib/gmaps-provider.ts). Workers Paid includes 10
# browser-hours/month; the per-day budget below keeps usage inside it.
# remote=true so `wrangler dev` uses Cloudflare's real browser pool
# (bills real browser-seconds); without it dev needs a local Chrome.
[browser]
binding = "BROWSER"
remote = true

# Edge rate limiting on write endpoints (POST /api/submissions* and
# POST /api/items/*/flag): 10 requests per minute per client IP, enforced in
# src/middleware/rate-limit.ts via the RATE_LIMITER binding. Zone-level WAF
# rate-limit rules can't apply to a *.workers.dev hostname, so the binding
# is the Cloudflare-native way to do this without a custom domain.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Cloudflare Email Service — transactional email (sign-in magic links +
# submission notifications) via env.EMAIL; no API key needed. The
# from-domain (AUTH_EMAIL_FROM above, no-reply@laparku.co.bn) must be
# onboarded to Email Sending — Dashboard → Compute → Email Service →
# Email Sending → Onboard Domain → laparku.co.bn (the API/token path
# needs an Email Sending: Edit scope the local tokens lack). `wrangler
# dev` simulates the binding: messages are written to a file whose path
# is logged, not delivered.
[[send_email]]
name = "EMAIL"

# Secrets (TURNSTILE_SECRET_KEY, BETTER_AUTH_SECRET, plus the optional
# product-lookup provider keys EAN_SEARCH_TOKEN / UPCITEMDB_KEY /
# BARCODELookup_KEY — unset keys just skip that provider) are set via
# `wrangler secret put` — never in this file.
